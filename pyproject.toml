[project]
name = "fwdcheck"
version = "0.1.0"
description = "AI fact-checking agent for WhatsApp forwards"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "requests>=2.31",
    "openai>=1.30",
    "python-dotenv>=1.0"
]

[tool.vercel]
entrypoint = "backend.app:app"
